[settings]

name="DialogsNoPortrait"

[background]

image="res://assets/sprites/panels/dialog_purple_light.png"
full_width=true
modulation=false
modulation_color="#f8ffffff"

[box]

size=Vector2( 341, 40 )
anchor=1
box_margin_bottom=0.0
box_margin_left=0.0
box_margin_top=25.0
box_margin_right=0.0

[next_indicator]

animation="Pulse"
scale=1
offset=Vector2( 5, 14 )
image="res://assets/sprites/position_indicator.png"

[text]

font="res://assets/tres/fonts/lana_pixel_dialog_text.tres"
bold_font="res://assets/tres/fonts/lana_pixel_dialog_text.tres"
italic_font="res://assets/tres/fonts/lana_pixel_dialog_text.tres"
text_margin_left=8.0
text_margin_right=-14.0
text_margin_bottom=2.0
text_margin_top=3.0
color="#ffffffff"
alignment=0
speed=2.0

[name]

font="res://assets/tres/fonts/lana_pixel_dialog_name.tres"
shadow_offset=Vector2( 1, 1 )
name_padding=Vector2( 0, 0 )
position=1
image="res://assets/sprites/box_square_focus.png"
image_visible=false
auto_color=false
is_hidden=false
bottom_gap=15.0
horizontal_offset=0.0
modulation=false
background_visible=false
background="#ff00a1f0"
shadow="#ff000000"

[ninepatch]

ninepatch_margin_top=2.0
ninepatch_margin_bottom=2.0
ninepatch_margin_left=0.0

[offset]

scale=Vector2( 10, 10 )

[audio]

typing={
"allow_interrupt": true,
"audio_bus": "Effects",
"enable": true,
"path": "res://assets/sfx/ui_text_bip.wav",
"pitch": 1.0,
"pitch_rand_range": 0.0,
"volume": -5.0,
"volume_rand_range": 0.0
}
selecting={
"allow_interrupt": true,
"audio_bus": "Effects",
"enable": true,
"path": "res://assets/sfx/ui_btn_accept.wav",
"pitch": 0.8,
"pitch_rand_range": 0.0,
"volume": 3.0,
"volume_rand_range": 0.0
}
hovering={
"allow_interrupt": true,
"audio_bus": "Master",
"enable": false,
"path": "res://assets/sfx/ui_btn_focused.wav",
"pitch": 1.0,
"pitch_rand_range": 0.0,
"volume": 0.0,
"volume_rand_range": 0.0
}
passing={
"allow_interrupt": true,
"audio_bus": "Master",
"enable": false,
"path": "res://assets/sfx/ui_btn_focused.wav",
"pitch": 0.8,
"pitch_rand_range": 0.0,
"volume": 0.0,
"volume_rand_range": 0.0
}

[definitions]

show_glossary=false

[buttons]

gap=4.0
anchor=4
layout=0
normal=[ true, Color( 1, 1, 1, 1 ), true, Color( 0, 0, 0, 1 ), false, "res://addons/dialogic/Example Assets/backgrounds/background-2.png", false, Color( 1, 1, 1, 1 ) ]
hover=[ true, Color( 1, 1, 1, 1 ), true, Color( 0, 0, 0, 1 ), true, "res://addons/dialogic/Example Assets/backgrounds/background-2.png", false, Color( 1, 1, 1, 1 ) ]
focus=[ true, Color( 1, 1, 1, 1 ), true, Color( 0.372549, 0.0627451, 0.0627451, 0.827451 ), true, "res://addons/dialogic/Example Assets/backgrounds/background-2.png", false, Color( 1, 1, 1, 1 ) ]
pressed=[ false, Color( 1, 1, 1, 1 ), true, Color( 0, 0, 0, 1 ), true, "res://addons/dialogic/Example Assets/backgrounds/background-2.png", false, Color( 1, 1, 1, 1 ) ]
disabled=[ false, Color( 1, 1, 1, 1 ), false, Color( 0, 0, 0, 1 ), true, "res://addons/dialogic/Example Assets/backgrounds/background-2.png", false, Color( 1, 1, 1, 1 ) ]
